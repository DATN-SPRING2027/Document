name: Document CI (YAML, JSON, OpenAPI & Shell Validation)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate YAML, JSON, OpenAPI & Deploy Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Document
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml

      - name: Validate all YAML & JSON contract/deploy files
        run: |
          python -c "
          import json, pathlib, sys, yaml
          root = pathlib.Path('.')
          errors = []
          for p in sorted(root.rglob('*')):
              if '.git' in p.parts or not p.is_file():
                  continue
              if p.suffix.lower() in {'.yaml', '.yml'}:
                  try:
                      list(yaml.safe_load_all(p.read_text(encoding='utf-8')))
                  except Exception as exc:
                      errors.append(f'YAML {p}: {exc}')
              elif p.suffix.lower() == '.json':
                  try:
                      json.loads(p.read_text(encoding='utf-8'))
                  except Exception as exc:
                      errors.append(f'JSON {p}: {exc}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('YAML & JSON validation OK')
          "

      - name: Validate shell backup scripts (bash -n)
        run: |
          for f in deploy/scripts/*.sh; do
            echo "Checking $f"
            bash -n "$f"
          done
