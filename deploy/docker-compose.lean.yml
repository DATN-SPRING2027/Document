# ==============================================================================
# Continuum AI — Reference Lean Deployment Blueprint (8GB–16GB Single VPS)
# File: Document/deploy/docker-compose.lean.yml
# STATUS: Reference blueprint synchronized 2026-11-27 (`INFRA-009`, `DOC-003`).
# Runnable production stacks live in:
#   - `DATN_BE/docker-compose.microservices.yml` & `DATN_BE/charts/continuum-ai/`
#   - `sag-laya-integration/SAG/compose.yaml`
# ==============================================================================

networks:
  continuum-vpc:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  sag-pgdata:
  sag-uploads:

services:
  ingress:
    image: nginx:alpine
    container_name: continuum-ingress
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx-continuum.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - continuum-vpc
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ../../DATN_FE
      dockerfile: Dockerfile
    container_name: continuum-frontend-nextjs
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CONTINUUM_API_BASE_URL: http://backend:3001
      CONTINUUM_TRUSTED_EDGE_HOPS: "1"
      NODE_OPTIONS: --max-old-space-size=384
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - continuum-vpc

  backend:
    build:
      context: ../../DATN_BE
      dockerfile: Dockerfile
    container_name: continuum-backend-core
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      MONGODB_URI: mongodb://db_mongo:27017/?replicaSet=rs0
      REDIS_HOST: db_redis
      REDIS_PORT: "6379"
      SAG_API_BASE_URL: http://ai_engine:8000
      SAG_BFF_SERVICE_TOKEN: ${SAG_BFF_SERVICE_TOKEN:?Set SAG_BFF_SERVICE_TOKEN}
      STORAGE_MODE: ${STORAGE_MODE:-r2}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-continuum-documents}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      MONGODB_MAX_POOL_SIZE: "15"
      BULLMQ_CONCURRENCY: "2"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/v1/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - continuum-vpc
    depends_on:
      db_mongo:
        condition: service_started
      db_redis:
        condition: service_healthy

  ai_engine:
    build:
      context: ../../sag-laya-integration/SAG/apps/api
      dockerfile: Dockerfile
    container_name: continuum-sag-api
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      PORT: "8000"
      SAG_DATABASE_URL: postgresql+asyncpg://${SAG_PG_USER:-sag}:${SAG_PG_PASSWORD:?Set SAG_PG_PASSWORD}@sag_postgres:5432/${SAG_PG_DB:-sag}
      SAG_VECTOR_BACKEND: qdrant
      SAG_QDRANT_URL: ${SAG_QDRANT_URL:?Set SAG_QDRANT_URL}
      SAG_QDRANT_API_KEY: ${SAG_QDRANT_API_KEY:-}
      SAG_BFF_SERVICE_TOKEN: ${SAG_BFF_SERVICE_TOKEN:?Set SAG_BFF_SERVICE_TOKEN}
      SAG_UPLOAD_DIR: /app/uploads
    volumes:
      - sag-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - continuum-vpc
    depends_on:
      sag_postgres:
        condition: service_healthy

  db_mongo:
    image: mongo:7.0
    container_name: continuum-mongodb-rs0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1.0"]
    volumes:
      - mongo-data:/data/db
    networks:
      - continuum-vpc

  sag_postgres:
    image: postgres:16-alpine
    container_name: continuum-sag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SAG_PG_USER:-sag}
      POSTGRES_PASSWORD: ${SAG_PG_PASSWORD:?Set SAG_PG_PASSWORD}
      POSTGRES_DB: ${SAG_PG_DB:-sag}
    volumes:
      - sag-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SAG_PG_USER:-sag} -d ${SAG_PG_DB:-sag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - continuum-vpc

  db_redis:
    image: redis:7.2-alpine
    container_name: continuum-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "400mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - continuum-vpc
