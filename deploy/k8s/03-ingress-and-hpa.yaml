# ==============================================================================
# Continuum AI — Reference Ingress Nginx (TLS + SSE-safe) & HPA
# Synchronized 2026-11-27 (`INFRA-009`, `INFRA-007`)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: continuum-ingress
  namespace: continuum-core
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - continuum.local
      secretName: continuum-tls
  rules:
    - host: continuum.local
      http:
        paths:
          # API & WebSockets -> Backend Core (port 3001)
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 3001
          - path: /internal/chat/ws
            pathType: Exact
            backend:
              service:
                name: backend-service
                port:
                  number: 3001
          # Next.js Frontend (port 3000)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
---
# ==============================================================================
# Horizontal Pod Autoscaler: Backend Core & Frontend
# NOTE: ai-engine stays single-replica (`replicas: 1`) in MVP while InProcJobQueue
# + RWO upload volume are active (`SAG-ING-005`).
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-core-hpa
  namespace: continuum-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-core
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-nextjs-hpa
  namespace: continuum-core
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-nextjs
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
